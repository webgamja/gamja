name: Idea / 아이디어
description: Suggest a new feature or an improvement / 이런 게 있었으면 좋겠어요
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do? / 무엇을 하고 싶으세요?
      description: Tell us about the situation first, then your idea. 어떤 상황인지 먼저, 그다음 아이디어를 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea / 아이디어
  - type: textarea
    id: alt
    attributes:
      label: Other ways you tried / 다른 방법을 써 본 적이 있나요?
