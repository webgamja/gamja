<!doctype html>
<!-- 비상 모드: app.js/style.css가 망가져도 쓸 수 있도록 이 파일 하나로 동작한다(스타일·아이콘·글 모두 이 안에 있다). 함부로 고치지 말 것. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>감자 비상 모드</title>
<script>try { var th = JSON.parse(localStorage.getItem('cc:theme')); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<style>
  /* 감자 디자인과 같은 색·모양: 회색 바탕 + 흰 카드, 노란 큰 버튼, 둥근 모서리 */
  /* 밝은 화면/어두운 화면: 감자 화면에서 정한 테마(밝게·어둡게)를 그대로 따른다. "자동"이면 폰 설정을 따른다 */
  :root { --bg: #f2f4f6; --card: #fff; --text: #191f28; --sub: #6b7684; --line: #e5e8eb; --me: #fee500; --me-fg: #191919; --danger: #e5484d; --code-bg: #f4f5f7; --code-fg: #24292f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #101114; --card: #1c1d22; --text: #f2f4f6; --sub: #9aa1ab; --line: #2b2d33; --code-bg: #111113; --code-fg: #e6e6e6; }
  }
  :root[data-theme="dark"] { --bg: #101114; --card: #1c1d22; --text: #f2f4f6; --sub: #9aa1ab; --line: #2b2d33; --code-bg: #111113; --code-fg: #e6e6e6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; padding: calc(10px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .gi { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .gi .a { fill: var(--me); }
  .bar { display: flex; align-items: center; height: 44px; margin: 0 -6px; }
  .back { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--text); text-decoration: none; }
  .back:active { background: rgba(128,128,128,.18); }
  h1 { display: flex; align-items: center; gap: 12px; margin: 6px 4px 8px; font-size: 26px; line-height: 1.3; font-weight: 800; letter-spacing: -.3px; }
  h1 .ico { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 17px; background: var(--me); color: var(--me-fg); }
  h1 .ico .gi { stroke: currentColor; } h1 .ico .gi .a { fill: none; }
  .note { margin: 0 4px 18px; font-size: 13px; line-height: 1.55; color: var(--sub); }
  h3 { margin: 26px 4px 10px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .card { padding: 4px; border-radius: 16px; background: var(--card); margin-bottom: 8px; }
  input, textarea { display: block; width: 100%; padding: 14px 16px; border: 0; border-radius: 14px; background: transparent; color: var(--text); font: inherit; font-size: 16px; outline: none; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--sub); opacity: .8; }
  .field { border-radius: 14px; background: var(--card); margin-bottom: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; margin: 8px 0 0; border: 0; border-radius: 14px; background: var(--me); color: var(--me-fg); font: inherit; font-size: 17px; font-weight: 800; }
  .btn:active { filter: brightness(.95); }
  .btn.ghost { height: 50px; background: var(--line); color: var(--text); font-size: 16px; font-weight: 700; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; margin: 0 0 8px; border: 0; border-radius: 16px; background: var(--card); color: var(--text); font: inherit; text-align: left; }
  .row:active { filter: brightness(.96); }
  .row .pic { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--bg); }
  .row b { display: block; font-size: 16px; font-weight: 700; }
  .row small { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); line-height: 1.4; }
  .row .mid { flex: 1; min-width: 0; }
  .row i { flex: none; font-style: normal; font-size: 22px; color: var(--sub); }
  .log { margin: 8px 0 0; padding: 14px; min-height: 84px; border-radius: 16px; background: var(--code-bg); color: var(--code-fg); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .log:empty::before { content: '여기에 진행 상황이 보여요'; color: var(--sub); }
  [hidden] { display: none !important; }
  /* 확인 창: 아래에서 올라오는 시트 (이 파일 안에서 직접 만든다) */
  .bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 520px; padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: var(--card); animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .sheet p { margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--sub); }
  .sheet .btn.danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div class="bar">
  <a class="back" id="backLink" href="/" aria-label="평소 화면으로"><svg class="gi" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>
</div>
<h1><span class="ico"><svg class="gi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M18.4 5.6l-3.9 3.9M5.6 18.4l3.9-3.9M18.4 18.4l-3.9-3.9"/></svg></span>비상 모드</h1>
<p class="note">평소 화면이 망가졌을 때 쓰는 페이지예요. Claude에게 고쳐 달라고 하거나, 재시작하거나, 이전 버전으로 되돌릴 수 있어요.</p>

<div id="loginBox" hidden>
  <h3>로그인</h3>
  <div class="field"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"></div>
  <button id="loginBtn" class="btn">로그인</button>
</div>

<div id="askBox">
  <h3>Claude에게 요청하기</h3>
  <div class="field"><textarea id="msg" rows="4" placeholder="예) 화면이 안 떠. 고치고 재시작해 줘"></textarea></div>
  <button id="sendBtn" class="btn"><svg class="gi" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg>Claude에게 보내기</button>
</div>

<h3>재시작과 되돌리기</h3>
<button id="restartBtn" class="row" type="button"><span class="pic"><svg class="gi" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></svg></span><span class="mid"><b>재시작</b><small>새 코드를 검사한 뒤 감자알을 다시 켜요</small></span><i>›</i></button>
<button id="rollbackBtn" class="row" type="button"><span class="pic"><svg class="gi" viewBox="0 0 24 24"><path d="M9 5L4 10l5 5M4 10h9a6 6 0 0 1 0 12"/></svg></span><span class="mid"><b>이전 버전으로 되돌리기</b><small>방금 바뀐 코드가 문제일 때 이전 안정 버전으로</small></span><i>›</i></button>

<h3>진행 상황</h3>
<pre id="out" class="log"></pre>

<script>
  const $ = (id) => document.getElementById(id);
  const out = $('out');
  const log = (t) => { out.textContent += t; window.scrollTo(0, document.body.scrollHeight); };
  // ←: 감자 화면에서 들어왔으면 뒤로 가기로 있던 화면 그대로 돌려보낸다 (새로 켜지 않아서 깜빡임이 없다). 아니면 처음 화면으로
  $('backLink').onclick = (e) => {
    try { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) { e.preventDefault(); history.back(); } } catch (err) { /* 그냥 링크대로 간다 */ }
  };
  // 요청·재시작·되돌리기를 보낼 곳: 감자 코드가 있는 gamja 크루가 있으면 거기(개발용 폰), 없으면 기본 대화방(일반 이용자). gamja가 없으면 "Claude에게 요청하기"는 숨긴다
  let target = 'gamja';
  async function loadTarget() {
    try {
      const r = await fetch('/api/projects');
      if (!r.ok) return;
      const has = ((await r.json()).projects || []).includes('gamja');
      target = has ? 'gamja' : '';
      $('askBox').hidden = !has;
    } catch (e) { /* 못 불러오면 gamja로 그대로 둔다 */ }
  }
  // 확인 창(아래에서 올라오는 시트). 실패하면 기본 확인창으로 대신한다
  function ask(title, msg, okLabel, danger) {
    return new Promise((resolve) => {
      try {
        const bg = document.createElement('div');
        bg.className = 'bg';
        bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h2></h2><p></p><button class="btn' + (danger ? ' danger' : '') + '" data-ok="1"></button><button class="btn ghost">취소</button></div>';
        bg.querySelector('h2').textContent = title;
        bg.querySelector('p').textContent = msg;
        bg.querySelector('[data-ok]').textContent = okLabel;
        const done = (v) => { bg.remove(); resolve(v); };
        bg.addEventListener('click', (e) => { if (e.target === bg) done(false); else if (e.target.closest('[data-ok]')) done(true); else if (e.target.closest('.ghost')) done(false); });
        document.body.appendChild(bg);
      } catch (e) { resolve(confirm(title + '\n' + msg)); }
    });
  }
  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) { $('loginBox').hidden = false; throw new Error('로그인이 필요해요'); }
    return r;
  }
  fetch('/api/me').then((r) => r.json()).then((d) => { $('loginBox').hidden = !!d.authed; if (d.authed) loadTarget(); }).catch(() => log('서버에 연결할 수 없어요. 재시작 중이면 잠시 후 새로고침하세요.\n'));
  $('loginBtn').onclick = async () => {
    const r = await post('/api/login', { password: $('pw').value }).catch((e) => ({ ok: false, json: async () => ({ error: e.message }) }));
    if (r.ok) { $('loginBox').hidden = true; loadTarget(); } else log(((await r.json()).error || '로그인 실패') + '\n');
  };
  $('sendBtn').onclick = async () => {
    const message = $('msg').value.trim();
    if (!message) return;
    out.textContent = '';
    try {
      const r = await post('/api/chat', { message, project: target });
      if (!r.ok) return log(((await r.json().catch(() => ({}))).error || r.statusText) + '\n');
      $('msg').value = '';
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const ev = (chunk.match(/^event: (.*)$/m) || [])[1];
          const data = (chunk.match(/^data: (.*)$/m) || [])[1];
          if (!data) continue;
          const d = JSON.parse(data);
          if (ev === 'delta') log(d.text);
          else if (ev === 'tool') log(`\n[${d.text}]\n`);
          else if (ev === 'status' && d.text.includes('검사')) log(`\n${d.text}\n`);
          else if (ev === 'error') log(`\n❌ ${d.message}\n`);
        }
      }
      log('\n\n— 끝. 재시작을 요청했다면 몇 초 뒤 "평소 화면으로"를 눌러 결과를 확인하세요.\n');
    } catch (e) { log(`\n${e.message}\n`); }
  };
  async function admin(path, title, msg, okLabel, danger) {
    if (!(await ask(title, msg, okLabel, danger))) return;
    let force = false;
    for (let i = 0; i < 2; i++) {
      try {
        const r = await post(path, { project: target, force });
        const d = await r.json().catch(() => ({}));
        // 되돌리기는 답변 중에는 막혀 있다. 하지만 화면이 망가졌을 때가 바로 되돌릴 때라서, 고르면 답변을 멈추고 되돌린다
        if (r.status === 409 && path.indexOf('rollback') >= 0 && !force) {
          if (await ask('답변을 멈추고 되돌릴까요?', '지금 답변을 만드는 방이 있어요. 멈추고 되돌리면 진행 중인 답변은 지금까지의 글만 남아요.', '멈추고 되돌리기', true)) { force = true; continue; }
          return;
        }
        log(r.ok ? (d.ok === false ? '검사에 실패해서 재시작하지 않았어요. 평소 화면의 알림을 확인하세요.\n' : '진행 중이에요. 몇 초 뒤 평소 화면으로 돌아가 보세요.\n') : (d.error || r.statusText) + '\n');
        return;
      } catch (e) { log(e.message + '\n'); return; }
    }
  }
  $('restartBtn').onclick = () => admin('/api/admin/restart', '재시작할까요?', '새 코드를 검사한 뒤 감자알을 다시 켜요. 몇 초 걸려요.', '재시작', false);
  $('rollbackBtn').onclick = () => admin('/api/admin/rollback', '이전 버전으로 되돌릴까요?', '마지막으로 잘 돌던 안정 버전으로 코드를 되돌리고 다시 켜요. 답변이 진행 중이면 끝난 뒤에 할 수 있어요.', '되돌리기', true);
</script>
</body>
</html>
