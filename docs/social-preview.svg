<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" font-family="Noto Sans CJK KR, sans-serif">
<rect width="1280" height="640" fill="#FBF5E6"/>
<circle cx="1180" cy="40" r="260" fill="#F6E3A1" opacity=".55"/>
<circle cx="640" cy="690" r="220" fill="#F2D98A" opacity=".35"/>
<image href="social-char.svg" x="80" y="70" width="104" height="104"/>
<text x="206" y="130" font-size="64" font-weight="900" fill="#2B2418">GAMJA</text>
<text x="208" y="168" font-size="26" font-weight="800" fill="#7A6F5A">감자</text>
<text x="80" y="280" font-size="54" font-weight="900" fill="#2B2418">Your own AI crew,</text>
<text x="80" y="350" font-size="54" font-weight="900" fill="#2B2418">living in your phone.</text>
<rect x="80" y="376" width="420" height="12" rx="6" fill="#F2D98A"/>
<text x="80" y="460" font-size="32" font-weight="800" fill="#3B2F14">쓰던 안드로이드 폰에 나만의 AI 크루를.</text>
<text x="80" y="505" font-size="24" fill="#7A6F5A">No Mac mini, no cloud server. Claude Code in your pocket.</text>
<line x1="80" y1="548" x2="640" y2="548" stroke="#E6D9B8" stroke-width="2"/>
<text x="80" y="590" font-size="26" font-weight="800" fill="#2B2418">Open source · Apache-2.0 · webgamja.com</text>

<g transform="translate(862,70)">
