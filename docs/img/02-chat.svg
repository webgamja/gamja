<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" role="img" aria-label="GAMJA chat room">
  <style>
    text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
    .t{fill:#191919}.s{fill:#55606b}.b{font-weight:700}
  </style>
  <rect width="360" height="740" rx="38" fill="#1b1b1f"/>
  <rect x="8" y="8" width="344" height="724" rx="30" fill="#bacee0"/>

  <!-- 위쪽 줄: 크루 이름 · 결과물 · ⋯ -->
  <path d="M8 38a30 30 0 0 1 30-30h284a30 30 0 0 1 30 30v44H8z" fill="#a9bdce"/>
  <text x="28" y="30" font-size="11" class="t b">9:41</text>
  <text x="22" y="68" font-size="16" class="t" font-weight="600">🌐 홈페이지 ▾</text>
  <rect x="130" y="50" width="86" height="30" rx="15" fill="#fff" opacity=".55"/>
  <text x="173" y="70" font-size="13" text-anchor="middle" class="t b">👀 결과물</text>
  <text x="328" y="72" font-size="20" text-anchor="middle" class="t">⋯</text>

  <!-- 대화 -->
  <rect x="150" y="98" width="60" height="22" rx="11" fill="#000" opacity=".1"/>
  <text x="180" y="113" font-size="11" text-anchor="middle" class="s">오늘</text>

  <rect x="104" y="130" width="236" height="58" rx="14" fill="#fee500"/>
  <rect x="326" y="130" width="14" height="14" rx="4" fill="#fee500"/>
  <text x="116" y="154" font-size="14" class="t">우리 동네 카페 '봄날' 소개 페이지</text>
  <text x="116" y="174" font-size="14" class="t">만들어 줘. 메뉴도 넣고!</text>
  <text x="104" y="203" font-size="10" text-anchor="end" class="s">오전 9:41</text>

  <rect x="12" y="214" width="36" height="36" rx="14" fill="#d97757"/><text x="30" y="239" font-size="18" text-anchor="middle">🌐</text>
  <text x="58" y="228" font-size="12" class="s">홈페이지</text>
  <rect x="56" y="234" width="278" height="150" rx="14" fill="#fff"/>
  <rect x="56" y="234" width="14" height="14" rx="4" fill="#fff"/>
  <g font-size="14" class="t">
    <text x="68" y="258">'봄날' 소개 페이지를 만들었어요 ☕</text>
    <text x="68" y="286">• 첫 화면: 소개와 영업시간</text>
    <text x="68" y="308">• 메뉴: 커피와 디저트 가격표</text>
    <text x="68" y="330">• 오시는 길 안내</text>
    <text x="68" y="362">위쪽 <tspan class="b">👀 결과물</tspan>에서 열어 보세요.</text>
  </g>
  <text x="58" y="398" font-size="10" class="s">오전 9:42</text>

  <rect x="150" y="414" width="190" height="40" rx="14" fill="#fee500"/>
  <rect x="326" y="414" width="14" height="14" rx="4" fill="#fee500"/>
  <text x="162" y="439" font-size="14" class="t">제목을 더 따뜻하게 바꿔 줘</text>

  <!-- 진행 상태 -->
  <rect x="8" y="610" width="344" height="36" fill="#bacee0"/>
  <line x1="8" y1="610" x2="352" y2="610" stroke="#000" opacity=".08"/>
  <g fill="#55606b"><circle cx="26" cy="628" r="2.5"/><circle cx="35" cy="624" r="2.5" opacity=".7"/><circle cx="44" cy="628" r="2.5" opacity=".5"/></g>
  <text x="56" y="633" font-size="13" class="s">index.html 고치는 중...</text>

  <!-- 입력창 -->
  <rect x="8" y="646" width="344" height="86" fill="#fff"/>
  <line x1="8" y1="646" x2="352" y2="646" stroke="#000" opacity=".08"/>
  <rect x="20" y="656" width="320" height="46" rx="23" fill="#f2f2f2"/>
  <text x="40" y="688" font-size="22" class="s" text-anchor="middle">＋</text>
  <text x="62" y="684" font-size="15" class="s">메시지 입력</text>
  <text x="270" y="686" font-size="18" text-anchor="middle">🎤</text>
  <circle cx="316" cy="679" r="18" fill="#fee500"/><text x="316" y="685" font-size="16" text-anchor="middle" fill="#191919">➤</text>
</svg>
